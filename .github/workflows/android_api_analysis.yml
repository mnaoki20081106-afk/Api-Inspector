name: Android API Analysis

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "APK path inside this repo (e.g. apks/app.apk). Takes priority over apk_url"
        required: false
        type: string
        default: ""
      apk_url:
        description: "APK direct download URL (.apk / .xapk / bundle)"
        required: false
        type: string
        default: ""
      package_name:
        description: "Package name (e.g. com.example.app). Used for F-Droid fallback and manifest auto-detect"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          APK_PATH: ${{ inputs.apk_path }}
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if [ -z "$APK_PATH" ] && [ -z "$APK_URL" ] && [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Provide apk_path, apk_url, or package_name"
            exit 1
          fi

      - name: Static analysis (jadx)
        env:
          APK_PATH: ${{ inputs.apk_path }}
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          OUT_DIR: ${{ github.workspace }}/out
        run: bash .github/scripts/static_analysis.sh

      - name: Print results to job log / summary
        if: always()
        run: |
          mkdir -p out
          for f in meta.txt jadx.log urls.txt analysis.txt; do
            [ -f "out/$f" ] || continue
            echo "::group::$f ($(wc -l < "out/$f") lines)"
            cat "out/$f"
            echo "::endgroup::"
          done
          {
            echo "## TikTok Lite Static Analysis"
            echo '```'; cat out/meta.txt 2>/dev/null; echo '```'
            echo "### Endpoints ($(wc -l < out/urls.txt 2>/dev/null || echo 0))"
            echo '```'; cat out/urls.txt 2>/dev/null; echo '```'
            echo "### Full analysis"
            echo '```'; cat out/analysis.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
