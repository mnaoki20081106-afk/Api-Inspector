name: Android API Analysis

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "APK path inside this repo on the dispatched ref (e.g. apks/app.apk). Takes priority over apk_url"
        required: false
        type: string
        default: ""
      apk_url:
        description: "APK direct URL (.apk / .xapk). Empty = look up package_name on F-Droid"
        required: false
        type: string
        default: ""
      package_name:
        description: "Package name (e.g. com.example.app). Empty = auto-detect from the APK"
        required: false
        type: string
        default: ""
      duration_sec:
        description: "Capture duration in seconds"
        required: false
        type: string
        default: "60"
      runner:
        description: "Runner (macos-13 is retired; macos-15-intel = Intel x86_64 + HVF)"
        required: false
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - ubuntu-latest

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          APK_PATH: ${{ inputs.apk_path }}
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if [ -z "$APK_PATH" ] && [ -z "$APK_URL" ] && [ -z "$PACKAGE_NAME" ]; then
            echo "::error::apk_path, apk_url or package_name is required"
            exit 1
          fi

      - name: Enable KVM (Linux runner only)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Boot emulator, install, capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ inputs.apk_path }}
          APK_URL: ${{ inputs.apk_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          DURATION: ${{ inputs.duration_sec }}
          OUT_DIR: ${{ github.workspace }}/out
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture_api_logs.sh

      - name: Print results to job log / summary
        if: always()
        run: |
          mkdir -p out
          # api_logs.txt must exist even when nothing was captured
          [ -f out/api_logs.txt ] || : > out/api_logs.txt
          # job log is the primary channel for Claude (get_job_logs); artifact is the full copy
          for f in meta.txt install.log urls.txt api_logs_strict.txt api_logs.txt; do
            [ -f "out/$f" ] || continue
            echo "::group::$f ($(wc -l < "out/$f") lines)"
            head -n 800 "out/$f"
            echo "::endgroup::"
          done
          {
            echo "## Android API Analysis"
            echo '```'; cat out/meta.txt 2>/dev/null; echo '```'
            echo "### URLs ($(wc -l < out/urls.txt 2>/dev/null || echo 0))"
            echo '```'; head -n 100 out/urls.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-logs-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
